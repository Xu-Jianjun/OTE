defaults:
  - _self_
  - model: ote_clip
  - charset: 36_lowercase
  - dataset: synth

model:
  _convert_: all
  img_size: [ 32, 128 ]  # [ height, width ]
  max_label_length: 25
  # The ordering in charset_train matters. It determines the token IDs assigned to each character.
  charset_train: ???
  # For charset_test, ordering doesn't matter.
  charset_test: "0123456789abcdefghijklmnopqrstuvwxyz"
  batch_size: 100
  weight_decay: 0.0
  warmup_pct: 0.075  # equivalent to 1.5 epochs of warm up
  lr: 8.9e-4
  is_tps: true
  clip_name: ViT-B/32
  pretrain_dir: /data/xujj1998/ocr_recognition/pretrain_model/


data:
  _target_: strhub.data.module.SceneTextDataModule
  root_dir: /data/xujj1998/ocr_recognition/
  train_dir: ???
  batch_size: ${model.batch_size}
  img_size: ${model.img_size}
  charset_train: ${model.charset_train}
  charset_test: ${model.charset_test}
  max_label_length: ${model.max_label_length}
  remove_whitespace: true
  normalize_unicode: true
  augment: true
  num_workers: 2

trainer:
  _target_: pytorch_lightning.Trainer
  _convert_: all
  val_check_interval: 1000
  #max_steps: 169680  # 20 epochs x 8484 steps (for batch size = 384, real data)
  max_epochs: 20
  gradient_clip_val: 20
  accelerator: gpu
  devices: 2

ckpt_path: null
pretrained: null
experiment_name: batchsize_${model.batch_size}_lr_${model.lr}_data_{dataset}
hydra:
  output_subdir: config
  run:
    dir: /data/xujj1998/ocr_recognition/outputs/${model.name}/${now:%Y-%m-%d}_${experiment_name}
  sweep:
    dir: multirun/${model.name}/${experiment_name}
    subdir: ${hydra.job.override_dirname}

